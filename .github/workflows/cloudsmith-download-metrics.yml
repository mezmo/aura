name: "Cloudsmith download metrics"

on:
  schedule:
    # 01:23 UTC daily, snapshotting the previous UTC day. Running early leaves
    # the rest of the day to notice a failure and re-run it by hand. The odd
    # minute is deliberate: GitHub drops queued scheduled jobs under load, and
    # load peaks at the top of every hour.
    - cron: "23 1 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "Snapshot date (YYYY-MM-DD, UTC). Defaults to yesterday."
        required: false
        type: string
      dry_run:
        description: "Build the payload without sending it"
        required: false
        default: false
        type: boolean
  # TEMPORARY: remove before merging. schedule only fires on the default
  # branch and workflow_dispatch only appears once the file is on it, so a
  # push trigger is the only way to exercise this on a runner beforehand.
  # No paths filter, so any push to the branch re-runs it.
  push:
    branches:
      - "justingross/GH-648-sync-cloudsmith-download-totals-to-posthog"
  pull_request:
    paths:
      - "scripts/sync-cloudsmith-downloads.sh"
      - ".github/workflows/cloudsmith-download-metrics.yml"

permissions:
  contents: read

concurrency:
  group: cloudsmith-download-metrics
  cancel-in-progress: false

jobs:
  # Pull requests run code from the PR revision, which a contributor with push
  # access controls before review. It is given no credentials and no write
  # permissions: --selftest and --dry-run need neither, and a modified script
  # would not be bound by DRY_RUN. The dry run reads the public Cloudsmith
  # package list anonymously.
  verify:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Self-test
        run: scripts/sync-cloudsmith-downloads.sh --selftest

      - name: Dry run
        env:
          DRY_RUN: "1"
        run: scripts/sync-cloudsmith-downloads.sh

  sync:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4

      - name: Self-test
        run: scripts/sync-cloudsmith-downloads.sh --selftest

      - name: Snapshot Cloudsmith download totals
        env:
          # Optional: mezmo/aura is a public repository, and the package list
          # reads without a key. A key raises the rate limit and is required
          # should the repository ever stop being public.
          CLOUDSMITH_API_KEY: ${{ secrets.CLOUDSMITH_API_KEY }}
          POSTHOG_PROJECT_API_KEY: ${{ secrets.POSTHOG_PROJECT_API_KEY }}
          POSTHOG_API_READ_KEY: ${{ secrets.POSTHOG_API_READ_KEY }}
          POSTHOG_PROJECT_ID: ${{ vars.POSTHOG_PROJECT_ID }}
          # Inputs arrive as environment variables the script already reads, so
          # nothing user-supplied is interpolated into a shell command.
          SNAPSHOT_DATE: ${{ inputs.date }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
        run: scripts/sync-cloudsmith-downloads.sh

      - name: Report failure
        if: failure() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        run: |
          set -euo pipefail
          title="Cloudsmith download metrics sync failed"
          body=$(printf '%s\n\n%s\n' \
              "The scheduled snapshot failed: ${RUN_URL}" \
              "Re-run it from the Actions tab with workflow_dispatch, passing the snapshot date it was covering. Events are keyed by that date, so a retry re-sends the same events and PostHog deduplicates them.")
          existing=$(gh issue list --state open --search "${title} in:title" \
              --json number --jq '.[0].number // empty')
          if [ -n "${existing}" ]; then
              gh issue comment "${existing}" --body "${body}"
          else
              gh issue create --title "${title}" --body "${body}"
          fi
